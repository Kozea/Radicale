name: Generate documentation
on:
  push:
    paths:
    - DOCUMENTATION.md

permissions:
  contents: write
  pages: write

jobs:
  generate:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: gh-pages
      - name: Run generator
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: documentation-generator/run.py
